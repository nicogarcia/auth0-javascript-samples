<!doctype html>
<meta charset="UTF-8" />
<title>Auth0 Sample App</title>

<div id="view-loading">Loading...</div>

<div id="view-error" hidden></div>

<div id="view-authenticated" hidden>
  <p>Logged in as <span id="user-email"></span></p>
  <h1>User Profile</h1>
  <!-- highlight-start user-profile -->
  <pre id="user-profile"></pre>
  <!-- highlight-end user-profile -->
  <!-- highlight-start logout -->
  <button onclick="client.logout({logoutParams:{returnTo:location.origin}})">Logout</button>
  <!-- highlight-end logout -->
</div>

<div id="view-unauthenticated" hidden>
  <!-- highlight-start login-signup -->
  <button onclick="client.loginWithRedirect()">Login</button>
  <button onclick="client.loginWithRedirect({authorizationParams:{screen_hint:'signup'}})">Signup</button>
  <!-- highlight-end login-signup -->
</div>

<!-- Install the Auth0 SPA SDK -->
<!-- highlight-start add-sdk -->
<script src="https://cdn.auth0.com/js/auth0-spa-js/%SDK_VERSION%/auth0-spa-js.production.js"></script>
<!-- highlight-end add-sdk -->

<script>
  // Helpers
  const displayView = name => ['loading', 'error', 'authenticated', 'unauthenticated'].forEach(v => document.getElementById(`view-${v}`).hidden = v !== name);
  const setTextContent = (id, content) => document.getElementById(id).textContent = content;

  (async () => {
    // Initialize the Auth0 SDK
    /* highlight-start init-client */
    window.client = await auth0.createAuth0Client({
      domain: '%AUTH0_DOMAIN%',
      clientId: '%AUTH0_CLIENT_ID%',
      authorizationParams: { redirect_uri: location.origin },
    });
    /* highlight-end init-client */

    // Handle errors returned by Auth0 after a redirect
    if (location.search.includes("error=")) {
      const params = new URLSearchParams(location.search);
      setTextContent("view-error", `Error: ${params.get("error")} — ${params.get("error_description")}`);
      displayView("error");
      history.replaceState({}, "", location.pathname);
      return;
    }

    // Handle the redirect callback after a successful login
    if (location.search.includes("code=") && location.search.includes("state=")) {
      /* highlight-start handle-callback */
      await window.client.handleRedirectCallback();
      /* highlight-end handle-callback */
      history.replaceState({}, "", location.pathname);
    }

    if (await window.client.isAuthenticated()) {
      /* highlight-start get-user */
      const user = await window.client.getUser();
      /* highlight-end get-user */
      setTextContent("user-email", user.email);
      setTextContent("user-profile", JSON.stringify(user, null, 2));
      displayView("authenticated");
      return;
    }

    displayView("unauthenticated");
  })();
</script>
